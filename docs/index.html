  if(person.travel[index]>person.limit)reasons.push('referralCommuteMismatch');

      continue;
    }
    const waitingForSlot=eligible[index].length>0;
    waiting+=Number(waitingForSlot);
    noFit+=Number(!waitingForSlot);
    const reason=waitingForSlot
      ?eligible[index].map(job=>t(referralVacancies[job].role)).join(' · ')
      :referralVacancies.flatMap((job,j)=>person.roles.includes(job.role)
        ?[`${t(job.role)} · ${localized(referralBarriers(person,job,j))}`]:[]).join(' / ')||t('referralNoPreferred');
    const action=t(waitingForSlot?'referralReviewSlots':'referralReviewFit');
    followUp.push(`<li><strong>${person.id} · ${esc(t(waitingForSlot?'referralWaiting':'referralNoFit'))}</strong><small>${esc(reason)}</small><small>${esc(action)}</small></li>`);
  }
  by('referral-count').textContent=fmt(best.count);
  by('referral-waiting').textContent=fmt(waiting);
  by('referral-no-fit').textContent=fmt(noFit);
  by('referral-matches').innerHTML=matches.join('')||`<li>${esc(t('referralNoSuggested'))}</li>`;
  by('referral-follow-up').innerHTML=followUp.join('');
  function fillTable(id,headers,rows){
    by(id).innerHTML=`<thead><tr>${headers.map(key=>`<th scope="col">${esc(t(key))}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map((cell,index)=>index===0?`<th scope="row">${esc(cell)}</th>`:`<td>${esc(cell)}</td>`).join('')}</tr>`).join('')}</tbody>`;
  }
  fillTable('referral-people',['referralPerson','referralPreferences','referralAvailability','referralCommute','referralCertificates','referralTravel'],
    referralPeople.map(person=>[person.id,localized(person.roles),localized(person.shifts),mins(person.limit),
      localized(person.certificates),person.travel.map((time,index)=>`${referralVacancies[index].id} ${mins(time)}`).join(' · ')]));
  fillTable('referral-jobs',['referralVacancy','referralShift','referralRequires','referralSlots'],
    referralVacancies.map((job,index)=>[`${job.id} · ${t(job.role)}`,t(job.shift),t(job.certificate||'referralNone'),fmt(slots[index])]));
}
function updateText(){
  document.documentElement.lang=state.lang==='zh'?'zh-Hans':'en';
  document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=t(el.dataset.i);});
  document.querySelectorAll('[data-i-aria]').forEach(el=>{el.setAttribute('aria-label',t(el.dataset.iAria));});
  document.querySelectorAll('button[data-key]').forEach(button=>{
    button.setAttribute('aria-pressed',String(state[button.dataset.key]===button.dataset.value));
  });
  const options=policies.map(p=>`<option value="${p}">${esc(t(p))}</option>`).join('');
  for(const key of ['policy','comparison']){
    const select=by(key);
    if(select.dataset.lang!==state.lang){
      select.innerHTML=options;
      select.dataset.lang=state.lang;
    }
    select.value=state[key];
  }
}
function barChart(summary){
  const scores=policies.map(p=>({p,value:summary.policies[p].expected_shortfall_per_100}));
  const max=Math.max(5,Math.ceil(Math.max(...scores.map(row=>row.value))/5)*5);
  const rows=scores.map(({p,value})=>{
    const width=Math.max(0,100*value/max);
    return `<button type="button" class="bar-row" data-policy="${p}" aria-pressed="${p===state.policy}" aria-label="${esc(t(p))}, ${fmt(value,2)}"><span>${esc(t(p))}</span><svg aria-hidden="true" viewBox="0 0 100 5" preserveAspectRatio="none"><rect width="100" height="5" class="bar-track"/><rect width="${width}" height="5" class="bar-mark"/></svg><span class="bar-value">${fmt(value,2)}</span></button>`;
  });
  by('bars').innerHTML=rows.join('');
  by('bar-ticks').innerHTML=[0,max/2,max].map(v=>`<span>${fmt(v,v%1?1:0)}</span>`).join('');
}
function lineChart(svg,rows,key,reference,{percent=false,oracle=null,interactive=false,selectedDate=null}={}){
  const width=Math.max(265,Math.round(svg.getBoundingClientRect().width));
  const height=percent?146:218,left=34,right=13,top=14,bottom=29;
  const dataRows=rows.map(row=>({
    date:row.quarter_start,actual:key(row),reference:reference(row),oracle:oracle?.(row)
  }));
  if(!dataRows.length){svg.innerHTML='';return;}
  const peak=Math.max(...dataRows.flatMap(d=>[d.actual,d.reference,d.oracle??0]));
  const step=peak<=8?1:peak<=20?5:20;
  const ymax=percent?100:Math.max(step*4,Math.ceil(peak/step)*step);
  const count=dataRows.length;
  const x=index=>left+(width-left-right)*index/Math.max(1,count-1);
  const y=value=>top+(height-top-bottom)*(1-value/ymax);
  const ticks=Array.from({length:5},(_,i)=>ymax*i/4);
  const grid=ticks.map(v=>`<path d="M${left} ${y(v)}H${width-right}" class="chart-grid"/><text x="${left-5}" y="${y(v)+3.5}" text-anchor="end">${fmt(v,v%1?2:0)}${percent?'%':''}</text>`).join('');
  const labelIndices=width<430?[...new Set([0,Math.floor((count-1)/2),count-1])]:dataRows.map((_,i)=>i);
  const xLabels=labelIndices.map(i=>{
    const label=quarter(dataRows[i].date);
    return `<text x="${x(i)}" y="${height-8}" text-anchor="${i===0?'start':i===count-1?'end':'middle'}">${esc(width<430?label:label.replace(/^20/,"’"))}</text>`;
  }).join('');
  const points=field=>dataRows.map((r,i)=>`${x(i)},${y(r[field])}`).join(' ');
  const focused=dataRows.findIndex(row=>row.date===selectedDate);
  const guide=focused>=0?`<path d="M${x(focused)} ${top}V${height-bottom}" class="chart-focus"/>`:'';
  const oracleLine=oracle?`<polyline points="${points('oracle')}" fill="none" class="chart-oracle" stroke-width="1.5" stroke-dasharray="2 4"/>`:'';
  const markers=dataRows.map((row,i)=>`<circle cx="${x(i)}" cy="${y(row.actual)}" r="${i===focused?5:3.2}" class="chart-point" stroke-width="1"><title>${esc(quarter(row.date))} · ${fmt(row.actual,2)}${percent?'%':''}</title></circle>`).join('');
  const targets=interactive?dataRows.map((row,i)=>{
    const from=i===0?left:(x(i-1)+x(i))/2;
    const to=i===count-1?width-right:(x(i)+x(i+1))/2;
    return `<rect class="chart-hit" data-quarter="${row.date}" x="${from}" y="${top}" width="${to-from}" height="${height-top-bottom}"><title>${esc(quarter(row.date))} · ${fmt(row.actual,2)} / ${fmt(row.reference,2)}</title></rect>`;
  }).join(''):'';
  svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
  svg.innerHTML=`${grid}${xLabels}${guide}${oracleLine}<polyline points="${points('reference')}" fill="none" class="chart-reference" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${points('actual')}" fill="none" class="chart-policy" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>${markers}${targets}`;
}
function valueFor(row){
  if(state.metric==='feedback')return row.visible_test_labels;
  if(state.metric==='shortfall'){
    return Math.max(0,per100(row,'oracle_expected_invitations')-per100(row,'expected_invitations'));
  }
  return per100(row,'expected_invitations');
}
function displayedRows(selected){
  return selected.quarterly.filter(row=>row.policy===state.policy);
}
function comparisonRows(selected){
  return new Map(selected.quarterly.filter(row=>row.policy===state.comparison).map(row=>[row.quarter_start,row]));
}
function charts(){
  const selected=scenario();
  if(!selected)return;
  const rows=displayedRows(selected), compared=comparisonRows(selected);
  const adaptive=selected.quarterly.filter(row=>row.policy==='adaptive');
  const fixed=new Map(selected.quarterly.filter(row=>row.policy==='fixed_mix').map(row=>[row.quarter_start,row.decay_weight]));
  const oracle=state.metric==='invitations'?row=>per100(row,'oracle_expected_invitations'):null;
  lineChart(by('yield-chart'),rows,valueFor,row=>valueFor(compared.get(row.quarter_start)),{
    oracle,interactive:true,selectedDate:state.selectedQuarter
  });
  lineChart(by('weight-chart'),adaptive,r=>100*r.decay_weight,r=>100*(fixed.get(r.quarter_start)??0.1),{
    percent:true,selectedDate:state.selectedQuarter
  });
}
function renderQuarter(rows,compared){
  by('quarter-strip').innerHTML=rows.map(row=>{
    const date=row.quarter_start;
    const label=quarter(date);
    return `<button type="button" data-quarter="${date}" aria-label="${esc(label)}" aria-pressed="${date===state.selectedQuarter}">${esc(label.replace(/^20/,"’"))}</button>`;
  }).join('');
  const row=rows.find(row=>row.quarter_start===state.selectedQuarter);
  if(!row){by('quarter-readout').innerHTML='';return;}
  const primary=valueFor(row), other=valueFor(compared.get(row.quarter_start));
  const precision=state.metric==='feedback'?0:2;
  by('quarter-readout').innerHTML=`<strong>${esc(quarter(row.quarter_start))}</strong><span class="a">${esc(t(state.policy))} <b>${fmt(primary,precision)}</b></span><span class="b">${esc(t(state.comparison))} <b>${fmt(other,precision)}</b></span><span>${esc(t('pairDelta'))} <b>${fmt(primary-other,precision)}</b></span>`;
}
function render({focusPolicy=false,focusQuarter=false}={}){
  updateText();
  renderReferrals();
  const selected=scenario();
  by('empty').hidden=Boolean(selected);by('results').hidden=!selected;
  if(!selected)return;
  const {summary}=selected;
  const rows=displayedRows(selected), compared=comparisonRows(selected);
  if(!rows.some(row=>row.quarter_start===state.selectedQuarter))state.selectedQuarter=rows[0]?.quarter_start;
  by('scope').textContent=t(state.source==='jobtalash'?'realScope':'syntheticScope');
  by('workers').textContent=fmt(summary.workers);by('jobs').textContent=fmt(summary.jobs);
  by('allocations').textContent=fmt(summary.policies[state.policy].allocated);
  by('quarters').textContent=fmt(summary.test_quarters);
  by('yield-caption').textContent=t({invitations:'yieldHelp',shortfall:'shortfallHelp',feedback:'feedbackHelp'}[state.metric]);
  by('policy-legend').textContent=t(state.policy);
  by('comparison-legend').textContent=t(state.comparison);
  by('oracle-legend').hidden=state.metric!=='invitations';
  barChart(summary);
  charts();
  renderQuarter(rows,compared);
  const precision=state.metric==='feedback'?0:2;
  const columns=[t('quarter'),t('selected'),t(state.policy),t(state.comparison)];
  by('quarter-table').innerHTML=`<thead><tr>${columns.map(label=>`<th scope="col">${esc(label)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr class="${row.quarter_start===state.selectedQuarter?'focused-row':''}"><th scope="row">${esc(quarter(row.quarter_start))}</th><td>${fmt(row.allocated)}</td><td>${fmt(valueFor(row),precision)}</td><td>${fmt(valueFor(compared.get(row.quarter_start)),precision)}</td></tr>`).join('')}</tbody>`;
  if(focusPolicy)by('bars').querySelector(`[data-policy="${state.policy}"]`)?.focus();
  if(focusQuarter)by('quarter-strip').querySelector(`[data-quarter="${state.selectedQuarter}"]`)?.focus();
}
function choosePolicy(key,value){
  const other=key==='policy'?'comparison':'policy';
  if(state[other]===value)state[other]=state[key];
  state[key]=value;
}
document.addEventListener('click',event=>{
  const control=event.target.closest('button[data-key]');
  if(control){
    const {key,value}=control.dataset;
    state[key]=value;
    if(key==='theme')document.documentElement.dataset.theme=value;
    render();
    return;
  }
  const bar=event.target.closest('button[data-policy]');
  if(bar){choosePolicy('policy',bar.dataset.policy);render({focusPolicy:true});return;}
  const quarterControl=event.target.closest('[data-quarter]');
  if(quarterControl){
    state.selectedQuarter=quarterControl.dataset.quarter;
    render({focusQuarter:quarterControl.tagName==='BUTTON'});
  }
});
for(const key of ['policy','comparison']){
  by(key).addEventListener('change',event=>{choosePolicy(key,event.target.value);render();});
}
by('reset').addEventListener('click',()=>{Object.assign(state,defaultFilters);render();});
for(const id of ['referral-budget','referral-warehouse']){
  by(id).addEventListener('change',renderReferrals);
}
let frame=0;
window.addEventListener('resize',()=>{cancelAnimationFrame(frame);frame=requestAnimationFrame(charts);});
render();
</script>
</body>
</html>
