* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); line-height: 1.6; }
button, select { font: inherit; }
button { cursor: pointer; }
a { color: var(--blue); text-underline-offset: 4px; }
button:focus-visible, select:focus-visible, a:focus-visible, summary:focus-visible {

.hero { padding: 20px 0 30px; border-bottom: 1px solid var(--line); }

.hero p { max-width: 700px; margin: 0; color: var(--muted); font-size: 1rem; }

.table-scroll { overflow: auto; margin-top: 7px; }

<script>
const copy={
 en:{kicker:'Simulation notebook',headline:'Job matching under delayed feedback',intro:'Compare five allocation policies over eight quarters. Choose the candidate graph and the strength of simulated drift.',languageGroup:'Language',themeGroup:'Appearance',light:'Light',dark:'Dark',source:'Candidate graph',jobtalash:'JobTalash structure',synthetic:'Synthetic graph',drift:'Simulated drift',stable:'Stable',moderate:'Moderate',strong:'Strong',policy:'Policy to inspect',workers:'Workers in graph',jobs:'Jobs in graph',allocations:'Selections per policy',quarters:'Test quarters',gapTitle:'Distance from the oracle',gapHelp:'Expected invitation shortfall per 100 selected pairs. Lower is better. Select a bar to inspect that policy.',yieldTitle:'Quarterly matching performance',yieldHelp:'Expected invitations per 100 selected pairs',oracle:'Feasible oracle',weightTitle:'How the mixture adapts',weightHelp:'Weight on the recency-weighted expert. The fixed and adaptive mixtures both start at 10%.',interpret:'How to read this experiment',interpretText:'The oracle solves the same capacity-constrained matching problem using simulated invitation probabilities. Each view shows one run with seed 42. Invitation probabilities and feedback are simulated in both modes, so these charts describe the experiment’s behavior rather than measured recruitment outcomes.',citation:'JobTalash replication data · Harvard Dataverse ↗',table:'View the selected policy’s quarterly values',quarter:'Quarter',selected:'Selected pairs',estimate:'Policy per 100',oracleRate:'Oracle per 100',visible:'Visible test labels',footer:'Job Matching Lab · Interactive example from reproducible CLI outputs',empty:'Experiment outputs are being prepared.',realScope:'JobTalash mode uses recorded worker–job delivery relationships and calendar structure. Features, invitation outcomes and feedback are simulated.',syntheticScope:'Synthetic mode generates the candidate graph, features, invitation outcomes and feedback.',static:'Static',uniform:'Equal-weight',decay:'Recency-weighted',fixed_mix:'Fixed mixture',adaptive:'Adaptive mixture'},
 zh:{kicker:'模拟实验札记',headline:'延迟反馈下的人岗匹配',intro:'比较五种分配策略在八个季度中的表现。可切换候选关系图与模拟漂移强度。',languageGroup:'语言',themeGroup:'外观',light:'浅色',dark:'深色',source:'候选关系图',jobtalash:'JobTalash 真实结构',synthetic:'合成图',drift:'模拟漂移',stable:'稳定',moderate:'中等',strong:'强',policy:'查看策略',workers:'图中求职者',jobs:'图中岗位',allocations:'每策略选中配对',quarters:'测试季度',gapTitle:'各策略离理想分配有多远',gapHelp:'每 100 个选中配对的预期邀请缺口，越小越好。点击条形可查看相应策略。',yieldTitle:'逐季度匹配表现',yieldHelp:'每 100 个选中配对的预期邀请',oracle:'可行理想分配',weightTitle:'混合权重如何变化',weightHelp:'图中显示近期加权模型的权重。固定混合和自适应混合的起始权重都是 10%。',interpret:'如何解读',interpretText:'理想分配使用模拟邀请概率求解同一个容量受限的匹配问题。每个画面展示固定随机种子 42 的一次运行。两种模式的邀请概率和反馈都由模拟生成，因此图表衡量的是实验中的策略表现。',citation:'JobTalash 复现数据 · Harvard Dataverse ↗',table:'查看所选策略的季度数值',quarter:'季度',selected:'选中配对',estimate:'策略每百对',oracleRate:'理想每百对',visible:'已观察测试标签',footer:'Job Matching Lab · 基于可复现命令行结果',empty:'实验结果正在准备。',realScope:'真实结构模式采用 JobTalash 的送达关系与时间结构。特征、邀请结果和反馈由模拟生成。',syntheticScope:'合成模式的候选图、特征、邀请结果和反馈均由模拟生成。',static:'静态模型',uniform:'等权更新',decay:'近期加权',fixed_mix:'固定混合',adaptive:'自适应混合'}
};
let data={};
try{data=JSON.parse(document.getElementById('experiment-data').textContent);}catch{}
const state={lang:'en',theme:document.documentElement.dataset.theme,source:'jobtalash',drift:'1',policy:'adaptive'};
const policies=['static','uniform','decay','fixed_mix','adaptive'];
const by=id=>document.getElementById(id);
const t=key=>copy[state.lang][key];
const fmt=(value,digits=0)=>new Intl.NumberFormat(state.lang==='zh'?'zh-CN':'en',{minimumFractionDigits:digits,maximumFractionDigits:digits}).format(value);
const quarter=date=>`${date.slice(0,4)} Q${Math.floor((Number(date.slice(5,7))-1)/3)+1}`;
const per100=(row,key)=>row.allocated?row[key]*100/row.allocated:0;
const esc=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const scenario=()=>data[state.source]?.[state.drift];
function updateText(){
  document.documentElement.lang=state.lang==='zh'?'zh-Hans':'en';
  document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=t(el.dataset.i);});
  document.querySelectorAll('[data-i-aria]').forEach(el=>{el.setAttribute('aria-label',t(el.dataset.iAria));});
  document.querySelectorAll('button[data-key]').forEach(button=>{
    button.setAttribute('aria-pressed',String(state[button.dataset.key]===button.dataset.value));
  });
  by('policy').innerHTML=policies.map(p=>`<option value="${p}">${esc(t(p))}</option>`).join('');
  by('policy').value=state.policy;
}
function barChart(summary){
  const scores=policies.map(p=>({p,value:summary.policies[p].expected_shortfall_per_100}));
  const max=Math.max(5,Math.ceil(Math.max(...scores.map(row=>row.value))/5)*5);
  const rows=scores.map(({p,value})=>{
    const width=Math.max(0,100*value/max);
    return `<button type="button" class="bar-row" data-policy="${p}" aria-pressed="${p===state.policy}" aria-label="${esc(t(p))}, ${fmt(value,2)}"><span>${esc(t(p))}</span><svg aria-hidden="true" viewBox="0 0 100 5" preserveAspectRatio="none"><rect width="100" height="5" class="bar-track"/><rect width="${width}" height="5" class="bar-mark"/></svg><span class="bar-value">${fmt(value,2)}</span></button>`;
  });
  by('bars').innerHTML=rows.join('');
  by('bar-ticks').innerHTML=[0,max/2,max].map(v=>`<span>${fmt(v,v%1?1:0)}</span>`).join('');
}
function lineChart(svg,rows,key,reference,{percent=false}={}){
  const width=Math.max(265,Math.round(svg.getBoundingClientRect().width));
  const height=percent?146:218,left=34,right=13,top=14,bottom=29;
  const dataRows=rows.map(row=>({date:quarter(row.quarter_start),actual:key(row),reference:reference(row)}));
  if(!dataRows.length){svg.innerHTML='';return;}
  const ymax=percent?100:Math.max(20,Math.ceil(Math.max(...dataRows.flatMap(d=>[d.actual,d.reference]))/20)*20);
  const count=dataRows.length;
  const x=index=>left+(width-left-right)*index/Math.max(1,count-1);
  const y=value=>top+(height-top-bottom)*(1-value/ymax);
  const ticks=Array.from({length:5},(_,i)=>ymax*i/4);
  const grid=ticks.map(v=>`<path d="M${left} ${y(v)}H${width-right}" class="chart-grid"/><text x="${left-5}" y="${y(v)+3.5}" text-anchor="end">${fmt(v)}${percent?'%':''}</text>`).join('');
  const labelIndices=width<430?[0,Math.floor((count-1)/2),count-1]:dataRows.map((_,i)=>i);
  const xLabels=labelIndices.map(i=>`<text x="${x(i)}" y="${height-8}" text-anchor="${i===0?'start':i===count-1?'end':'middle'}">${esc(width<430?dataRows[i].date:dataRows[i].date.replace(/^20/,"’"))}</text>`).join('');
  const points=field=>dataRows.map((r,i)=>`${x(i)},${y(r[field])}`).join(' ');
  const markers=dataRows.map((row,i)=>`<circle cx="${x(i)}" cy="${y(row.actual)}" r="3.2" class="chart-point" stroke-width="1"><title>${esc(row.date)} · ${fmt(row.actual,2)}${percent?'%':''}</title></circle>`).join('');
  svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
  svg.innerHTML=`${grid}${xLabels}<polyline points="${points('reference')}" fill="none" class="chart-reference" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${points('actual')}" fill="none" class="chart-policy" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>${markers}`;
}
function charts(){
  const selected=scenario();
  if(!selected)return;
  const rows=selected.quarterly.filter(row=>row.policy===state.policy);
  const adaptive=selected.quarterly.filter(row=>row.policy==='adaptive');
  const fixed=new Map(selected.quarterly.filter(row=>row.policy==='fixed_mix').map(row=>[row.quarter_start,row.decay_weight]));
  lineChart(by('yield-chart'),rows,r=>per100(r,'expected_invitations'),r=>per100(r,'oracle_expected_invitations'));
  lineChart(by('weight-chart'),adaptive,r=>100*r.decay_weight,r=>100*(fixed.get(r.quarter_start)??0.1),{percent:true});
}
function render({focusPolicy=false}={}){
  updateText();
  const selected=scenario();
  by('empty').hidden=Boolean(selected);by('results').hidden=!selected;
  if(!selected)return;
  const {summary,quarterly}=selected;
  by('scope').textContent=t(state.source==='jobtalash'?'realScope':'syntheticScope');
  by('workers').textContent=fmt(summary.workers);by('jobs').textContent=fmt(summary.jobs);
  by('allocations').textContent=fmt(summary.policies[state.policy].allocated);
  by('quarters').textContent=fmt(summary.test_quarters);
  by('yield-caption').textContent=t('yieldHelp');by('policy-legend').textContent=t(state.policy);
  barChart(summary);
  charts();
  const columns=['quarter','selected','estimate','oracleRate','visible'];
  const rows=quarterly.filter(row=>row.policy===state.policy).map(row=>[quarter(row.quarter_start),fmt(row.allocated),fmt(per100(row,'expected_invitations'),2),fmt(per100(row,'oracle_expected_invitations'),2),fmt(row.visible_test_labels)]);
  by('quarter-table').innerHTML=`<thead><tr>${columns.map(key=>`<th scope="col">${esc(t(key))}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map((value,index)=>index===0?`<th scope="row">${esc(value)}</th>`:`<td>${esc(value)}</td>`).join('')}</tr>`).join('')}</tbody>`;
  if(focusPolicy)by('bars').querySelector(`[data-policy="${state.policy}"]`)?.focus();
}
document.addEventListener('click',event=>{
  const control=event.target.closest('button[data-key]');
  if(control){
    const {key,value}=control.dataset;
    state[key]=value;
    if(key==='theme'){
      document.documentElement.dataset.theme=value;
      try{localStorage.setItem('jobmatching-theme',value);}catch{}
      updateText();
    }else render();
    return;
  }
  const bar=event.target.closest('button[data-policy]');
  if(bar){state.policy=bar.dataset.policy;render({focusPolicy:true});}
});
by('policy').addEventListener('change',event=>{state.policy=event.target.value;render();});
let frame=0;
window.addEventListener('resize',()=>{cancelAnimationFrame(frame);frame=requestAnimationFrame(charts);});
render();
</script>
